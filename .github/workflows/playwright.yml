name: EventHub Playwright CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_URL: https://eventhub.rahulshettyacademy.com/login
      API_BASE_URL: https://eventhub.rahulshettyacademy.com/api
      EVENTHUB_EMAIL: ${{ secrets.EVENTHUB_EMAIL }}
      EVENTHUB_PASSWORD: ${{ secrets.EVENTHUB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npx playwright install --with-deps
      - run: npm test
      - name: Upload Playwright report and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
